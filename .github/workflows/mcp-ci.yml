name: MCP CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Compile source, tests, and examples
        run: uv run python -m compileall src tests examples

      - name: Run pytest suite
        run: uv run pytest -q

  static-config:
    name: Static config checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse pyproject.toml
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          tomllib.loads(Path("pyproject.toml").read_text())
          print("pyproject.toml ok")
          PY

      - name: Parse package.json
        run: python -m json.tool package.json >/dev/null

      - name: Check deploy script syntax
        run: bash -n scripts/cf-deploy.sh

      - name: Verify wrangler settings
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path("wrangler.jsonc").read_text()
          for expected in [
              '"name": "remote-mcp-server-authless"',
              '"main": "src/worker.py"',
              '"compatibility_date": "2026-06-17"',
              '"python_workers"',
              '"name": "N_OF_1_MCP"',
              '"class_name": "PatientCausalMCPServer"',
          ]:
              assert expected in text
          print("wrangler.jsonc ok")
          PY

  cloudflare-import-smoke:
    name: Cloudflare local import smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install npm dependencies
        run: npm install

      - name: Sync Python dependencies
        run: uv sync

      - name: Verify pywrangler is available
        run: uv run pywrangler --version

      - name: Run Cloudflare import tests
        run: uv run pytest -q tests/test_cloudflare_worker_imports.py tests/test_mcp_server_factory.py
