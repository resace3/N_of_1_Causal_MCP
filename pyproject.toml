[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patient-causal-mcp"
version = "0.1.0"
description = "MCP server for synthetic N-of-1 patient simulation and causal analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Patient Causal MCP Contributors" }
]
dependencies = [
  "mcp>=1.0.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
patient-causal-mcp = "patient_causal_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
